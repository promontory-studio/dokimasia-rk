name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    outputs:
      version: ${{ steps.bump.outputs.version }}
      private: ${{ steps.bump.outputs.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true
      # npm's OIDC publishing needs CLI >= 11.5.1, which Node 22 does not bundle.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # package.json is the source of the version, so CHANGELOG.md can name the version it describes.
      # The patch only advances when that version is already tagged — which also steps over a tag
      # left behind by a release that failed after tagging, instead of wedging every later run.
      - name: Resolve the version to release
        id: bump
        run: |
          IFS='.' read -r major minor patch <<< "$(node -p "require('./package.json').version")"
          while git rev-parse -q --verify "refs/tags/v$major.$minor.$patch" >/dev/null; do
            patch=$((patch + 1))
          done
          new_version="$major.$minor.$patch"
          npm version "$new_version" --no-git-tag-version --allow-same-version
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "private=$(node -p "require('./package.json').private === true")" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
      # Gated on the flag rather than deleted, so publishing turns on with the single deliberate
      # commit that lifts `"private"` — and until then this job is green rather than permanently red.
      - name: Publish to npm
        if: steps.bump.outputs.private != 'true'
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes

  # The one bug class nothing before this point can catch: a claim that holds inside the checkout
  # and fails once the files sit in node_modules. The only way to run it is against the registry,
  # which means this job can only ever go red after a bad version is already public.
  smoke:
    needs: release
    if: needs.release.outputs.private != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The read replica lags the publish by minutes on a package this small.
      - name: Install the version just published
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y > /dev/null
          # Must be ESM, or plain node fails on module syntax before it ever reaches node_modules
          # and the last step would pass for the wrong reason.
          npm pkg set type=module
          version="${{ needs.release.outputs.version }}"
          for _ in $(seq 30); do
            npm install "@promontory-studio/dokimasia@$version" && exit 0
            sleep 20
          done
          echo "::error::@promontory-studio/dokimasia@$version never appeared on the registry"
          exit 1
      - name: Write a consumer
        working-directory: ${{ runner.temp }}
        run: |
          cat > use.ts <<'TS'
          import { wilson } from "@promontory-studio/dokimasia/stats";
          const ci: [number, number] = wilson(11, 12);
          if (!(ci[0] > 0.64 && ci[0] < 0.65)) throw new Error(`unexpected lower bound ${ci[0]}`);
          console.log("consumed:", ci);
          TS
      - name: A TypeScript toolchain type-checks it
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-save typescript
          npx tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 --strict use.ts
      - name: tsx runs it
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-save tsx
          npx tsx use.ts
      - name: A bundler bundles it
        working-directory: ${{ runner.temp }}
        run: |
          npm install --no-save esbuild
          npx esbuild use.ts --bundle --platform=node --format=esm --outfile=bundled.mjs
          node bundled.mjs
      # README says plain node cannot import it. If Node ever lifts the node_modules restriction
      # this goes red on purpose — the README would then be wrong in the other direction.
      - name: Plain node still cannot import it
        working-directory: ${{ runner.temp }}
        run: |
          if node use.ts 2> node-err.txt; then
            echo "::error::plain node imported the package; the README says it cannot"
            exit 1
          fi
          grep -q ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING node-err.txt || {
            cat node-err.txt
            echo "::error::plain node failed, but not for the reason the README documents"
            exit 1
          }
